<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — страница не найдена</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f141b;color:#eef3f7;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;padding:40px}
h1{font-size:120px;font-weight:700;color:#0a2e5c;background:linear-gradient(135deg,#0a2e5c,#1a6ba8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
p{color:#9aa4ae;font-size:18px;margin:12px 0 28px}
a{display:inline-block;background:#1a6ba8;color:#fff;text-decoration:none;padding:14px 34px;border-radius:10px;font-size:16px;transition:background .2s}
a:hover{background:#14527f}
</style>
</head>
<body>
<div class="wrap">
<h1>404</h1>
<p>Такой страницы нет.</p>
<a href="/">На главную</a>
</div>
</body>
</html>
